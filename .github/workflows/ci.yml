name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        module:
          - pkg
          - gateway
          - services/identity
          - services/vendor
          - services/catalog
          - services/inventory
          - services/cart
          - services/order
          - services/payment
          - services/shipment
          - services/admin
          - services/notification
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/${{ matrix.module }}/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
        working-directory: backend/${{ matrix.module }}

      - name: go vet
        run: go vet ./...
        working-directory: backend/${{ matrix.module }}

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend/${{ matrix.module }}
          args: --timeout=5m

      - name: go build
        run: go build ./...
        working-directory: backend/${{ matrix.module }}

      - name: go test
        run: go test -race ./...
        working-directory: backend/${{ matrix.module }}

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
