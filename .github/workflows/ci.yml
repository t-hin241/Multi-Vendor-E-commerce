name: CI

on:
  push:
    branches: [main]
  pull_request:

# Versions have one source each: the Go toolchain is the toolchain line of
# every go.mod (setup-go reads it), images are pinned by digest in the
# Dockerfiles and compose files. Jobs below read them from there, so a bump
# (by hand or by Dependabot) is exactly what CI tests.
jobs:
  pins:
    name: Toolchain and image pins
    runs-on: ubuntu-latest
    outputs:
      postgres: ${{ steps.images.outputs.postgres }}
      redis: ${{ steps.images.outputs.redis }}
      nats: ${{ steps.images.outputs.nats }}
    steps:
      - uses: actions/checkout@v5
      - name: Every image pinned by digest, one Go toolchain everywhere
        run: bash deploy/check-pins.sh
      # The integration jobs run these images: the ones production runs.
      - name: Infrastructure images from docker-compose.yml
        id: images
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --format json > stack.json
          for svc in postgres redis nats; do
            echo "$svc=$(jq -er ".services.$svc.image" stack.json)" >> "$GITHUB_OUTPUT"
          done

  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      # Report every failing module instead of cancelling the rest of the matrix.
      fail-fast: false
      matrix:
        module:
          - pkg
          - gateway
          - services/identity
          - services/vendor
          - services/catalog
          - services/inventory
          - services/cart
          - services/order
          - services/payment
          - services/shipment
          - services/admin
          - services/notification
          - services/review
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/${{ matrix.module }}/go.mod
          cache-dependency-path: backend/${{ matrix.module }}/go.sum

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
        working-directory: backend/${{ matrix.module }}

      - name: go vet
        run: go vet ./...
        working-directory: backend/${{ matrix.module }}

      # Action v8+ supports golangci-lint v2; v9 runs on Node 24. Pin the linter version
      # so a new release cannot break CI unexpectedly; bump it deliberately.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: backend/${{ matrix.module }}
          args: --timeout=5m

      - name: go build
        run: go build ./...
        working-directory: backend/${{ matrix.module }}

      - name: go test
        run: go test -race ./...
        working-directory: backend/${{ matrix.module }}

  identity-integration:
    name: Identity PostgreSQL and Redis integration
    runs-on: ubuntu-latest
    needs: pins
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres }}
        env:
          POSTGRES_USER: identity_test
          POSTGRES_DB: identity_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U identity_test -d identity_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: ${{ needs.pins.outputs.redis }}
        ports: ["6379:6379"]
    env:
      IDENTITY_TEST_DATABASE_URL: postgres://identity_test@localhost:5432/identity_test?sslmode=disable
      IDENTITY_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/identity/go.mod
          cache-dependency-path: backend/services/identity/go.sum
      - run: go test -race -count=1 ./...
        working-directory: backend/services/identity

  vendor-integration:
    name: Vendor transactions and selling permission integration
    runs-on: ubuntu-latest
    needs: pins
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres }}
        env:
          POSTGRES_USER: vendor_test
          POSTGRES_DB: vendor_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U vendor_test -d vendor_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VENDOR_TEST_DATABASE_URL: postgres://vendor_test@localhost:5432/vendor_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/vendor/go.mod
          cache-dependency-path: backend/services/vendor/go.sum
      - run: go test -race -count=1 ./...
        working-directory: backend/services/vendor

  review-integration:
    name: Review PostgreSQL integration
    runs-on: ubuntu-latest
    needs: pins
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres }}
        env:
          POSTGRES_USER: review_test
          POSTGRES_DB: review_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U review_test -d review_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REVIEW_TEST_DATABASE_URL: postgres://review_test@localhost:5432/review_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/review/go.mod
          cache-dependency-path: backend/services/review/go.sum
      - run: go test -race -count=1 ./...
        working-directory: backend/services/review

  catalog-integration:
    name: Catalog PostgreSQL and checkout fencing integration
    runs-on: ubuntu-latest
    needs: pins
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres }}
        env:
          POSTGRES_USER: catalog_test
          POSTGRES_DB: catalog_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U catalog_test -d catalog_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CATALOG_TEST_DATABASE_URL: postgres://catalog_test@localhost:5432/catalog_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/catalog/go.mod
          cache-dependency-path: backend/services/catalog/go.sum
      - run: go test -race -count=1 ./...
        working-directory: backend/services/catalog

  inventory-integration:
    name: Inventory, Cart, Order, Payment, Shipment, Notification and event bus integration (PostgreSQL/Redis/NATS)
    runs-on: ubuntu-latest
    needs: pins
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres }}
        env:
          POSTGRES_USER: inventory_test
          POSTGRES_DB: inventory_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U inventory_test -d inventory_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: ${{ needs.pins.outputs.redis }}
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INVENTORY_TEST_DATABASE_URL: postgres://inventory_test@localhost:5432/inventory_test?sslmode=disable
      ORDER_TEST_DATABASE_URL: postgres://inventory_test@localhost:5432/inventory_test?sslmode=disable
      PAYMENT_TEST_DATABASE_URL: postgres://inventory_test@localhost:5432/inventory_test?sslmode=disable
      CART_TEST_DATABASE_URL: postgres://inventory_test@localhost:5432/inventory_test?sslmode=disable
      SHIPMENT_TEST_DATABASE_URL: postgres://inventory_test@localhost:5432/inventory_test?sslmode=disable
      NOTIFICATION_TEST_DATABASE_URL: postgres://inventory_test@localhost:5432/inventory_test?sslmode=disable
      NOTIFICATION_TEST_REDIS_URL: redis://localhost:6379/0
      EVENTBUS_TEST_DATABASE_URL: postgres://inventory_test@localhost:5432/inventory_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/services/inventory/go.mod
          cache-dependency-path: backend/services/inventory/go.sum
      # GitHub service containers take no command; JetStream is enabled here.
      - name: Enable JetStream
        env:
          NATS_IMAGE: ${{ needs.pins.outputs.nats }}
        run: |
          docker run -d --name jetstream -p 4222:4222 "$NATS_IMAGE" -js
          echo "EVENTBUS_TEST_NATS_URL=nats://localhost:4222" >> "$GITHUB_ENV"
      # The production broker configuration (per-service users and
      # permissions) with a fake password for every user.
      - name: Broker with per-service permissions
        env:
          NATS_IMAGE: ${{ needs.pins.outputs.nats }}
        run: |
          # Quoted as in docker-compose.yml: unquoted, "5e62..." parses as a number.
          raw=5e62-test-eventbus-password-not-a-secret
          pw='"'$raw'"'
          docker run -d --name jetstream-auth -p 4223:4222 \
            -v "$PWD/deploy/nats/nats.conf:/etc/nats/nats.conf:ro" --tmpfs /data \
            -e VENDOR_EVENTBUS_PASSWORD=$pw -e CATALOG_EVENTBUS_PASSWORD=$pw -e INVENTORY_EVENTBUS_PASSWORD=$pw \
            -e ORDER_EVENTBUS_PASSWORD=$pw -e PAYMENT_EVENTBUS_PASSWORD=$pw -e SHIPMENT_EVENTBUS_PASSWORD=$pw \
            -e NOTIFICATION_EVENTBUS_PASSWORD=$pw "$NATS_IMAGE" -c /etc/nats/nats.conf
          echo "EVENTBUS_AUTH_TEST_NATS_URL=nats://localhost:4223" >> "$GITHUB_ENV"
          echo "EVENTBUS_AUTH_TEST_PASSWORD=$raw" >> "$GITHUB_ENV"
      - run: go test -race -count=1 ./pkg/eventbus/... ./pkg/events/... ./services/inventory/... ./services/cart/... ./services/order/... ./services/payment/... ./services/shipment/... ./services/notification/...
        working-directory: backend

  db-roles:
    name: Database roles (migrator and per-service runtime roles)
    runs-on: ubuntu-latest
    needs: pins
    services:
      postgres:
        image: ${{ needs.pins.outputs.postgres }}
        env:
          POSTGRES_USER: roles_admin
          POSTGRES_DB: roles_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U roles_admin" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/pkg/go.mod
          cache-dependency-path: backend/pkg/go.sum
      # Own throwaway cluster: the script drops and recreates the service databases.
      - run: bash deploy/test-db-roles.sh
        env:
          DB_ROLES_TEST_DISPOSABLE: "yes"
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: roles_admin
      - run: go test -count=1 ./platform/postgres/...
        working-directory: backend/pkg
        env:
          POSTGRES_ROLE_TEST_ADMIN_URL: postgres://roles_admin@localhost:5432/roles_admin?sslmode=disable
      - run: bash -n deploy/db-roles.sh && bash -n deploy/gen-db-passwords.sh && sh -n deploy/postgres-init/002-db-roles.sh

  edge-config:
    name: Published ports and edge proxy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Nothing but Caddy may be published on a public interface, with the
      # values from .env.example (the defaults an operator starts from).
      - name: Only loopback ports in the base stack
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config --format json > base.json
          jq -e '[.services[] | .ports[]? | select(.host_ip != "127.0.0.1")] | length == 0' base.json
      - name: Only Caddy 80/443 public with the edge override
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f deploy/compose.edge.yml config --format json > edge.json
          jq -e '[.services | to_entries[] | select(.key != "caddy") | .value.ports[]? | select(.host_ip != "127.0.0.1")] | length == 0' edge.json
          jq -e '[.services.caddy.ports[] | .published] - ["80", "443"] | length == 0' edge.json
          jq -e '(.services.gateway.ports // []) == [] and (.services.frontend.ports // []) == []' edge.json
          jq -e '.services.gateway.environment.TRUSTED_PROXY_CIDRS == .services.caddy.networks.edge.ipv4_address' edge.json
      - name: Caddyfile is valid and formatted
        run: |
          # The Caddy image production runs (pinned in deploy/compose.edge.yml).
          caddy_image=$(jq -er .services.caddy.image edge.json)
          docker run --rm -e SITE_DOMAIN=shop.example.invalid -e ACME_EMAIL=ops@example.invalid \
            -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" "$caddy_image" \
            sh -c 'caddy validate --config /etc/caddy/Caddyfile && caddy fmt /etc/caddy/Caddyfile | diff - /etc/caddy/Caddyfile'
      # Observability is internal: loopback ports only, valid rules, loadable dashboards.
      - name: Observability stack config
        run: |
          docker compose --env-file .env.example -f docker-compose.yml -f deploy/compose.edge.yml \
            -f deploy/observability/compose.observability.yml config --format json > obs.json
          jq -e '[.services | to_entries[] | select(.key != "caddy") | .value.ports[]? | select(.host_ip != "127.0.0.1")] | length == 0' obs.json
          prom=$(jq -er .services.prometheus.image obs.json)
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/cfg:ro" "$prom" check rules /cfg/alerts.yml
          sed 's#/etc/prometheus/alerts.yml#/cfg/alerts.yml#' deploy/observability/prometheus.yml > prometheus-ci.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/cfg:ro" -v "$PWD/prometheus-ci.yml:/p.yml:ro" "$prom" check config /p.yml
          for f in deploy/observability/grafana/dashboards/*.json; do jq -e '.uid and (.panels | length > 0)' "$f" > /dev/null; done
      - run: bash -n deploy/check-exposure.sh && bash -n deploy/rewrite-media-urls.sh && bash -n deploy/data-preflight.sh && bash -n deploy/observability/monitor-role.sh && bash -n deploy/loadtest/run.sh
      # Plan 14 DEV-01: seed/demo data stays in the local seed tooling; nothing
      # that builds an image may carry its accounts or placeholder passwords.
      - name: No seed accounts or demo credentials in image sources
        run: |
          if grep -rnIE "scraped\.local|SeedOnly|CHANGE_ME_BUYER_SEED" backend frontend \
               --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=testdata --exclude="*_test.go" \
               --exclude-dir=e2e --exclude="*.test.ts" --exclude="*.test.tsx"; then
            echo "seed markers found in image sources" >&2
            exit 1
          fi
      - name: Data preflight SQL is read-only
        run: |
          if grep -nIiE "^\s*(insert|update|delete|truncate|alter|drop|create|grant|revoke)([^a-z_]|$)" deploy/data-preflight/*.sql; then
            exit 1
          fi

  # A base image or toolchain bump only reaches production through these
  # Dockerfiles, so every image is built here from its pinned base.
  images:
    name: Docker image ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: pins
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, vendor, catalog, inventory, cart, order, payment, shipment, admin, notification, review, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker compose --env-file .env.example build "${{ matrix.service }}"
      - name: Runs as a non-root user
        run: |
          # Compose names a built image <project>-<service>; the project is "shopee".
          image=shopee-${{ matrix.service }}
          user=$(docker image inspect --format '{{.Config.User}}' "$image")
          echo "$image runs as '$user'"
          [ -n "$user" ] && [ "$user" != "root" ] && [ "$user" != "0" ]

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build

  frontend-e2e:
    name: Frontend browser E2E (mocked gateway)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the app against the mock gateway origin and serves it on :3100.
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
