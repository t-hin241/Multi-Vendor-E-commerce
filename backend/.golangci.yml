version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      exclude-functions:
        # Deferred rollback after a successful Commit returns ErrTxClosed by design.
        - (github.com/jackc/pgx/v5.Tx).Rollback
    staticcheck:
      checks:
        # golangci-lint v2 defaults, plus two style suggestions that hurt readability here:
        # S1016 (struct literal -> type conversion) and QF1001 (De Morgan rewrite).
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -S1016
        - -QF1001
  exclusions:
    # Keep golangci-lint v1 default exclusions (unchecked Close/Flush/print...).
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
