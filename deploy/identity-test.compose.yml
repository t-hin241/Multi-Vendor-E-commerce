name: shopee-identity-tests
services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: identity_test
      POSTGRES_USER: identity_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:55431:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "identity_test", "-d", "identity_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    ports: ["127.0.0.1:56391:6379"]
  nats:
    image: nats:2.14.7-alpine3.22@sha256:4063edae0717ba5f7501bfde75f97fd9b57f5b93597b92c70b6a6fbbf6a74e06
    command: ["-js", "-sd", "/tmp/js"]
    ports: ["127.0.0.1:54222:4222"]
  # The production broker configuration (per-service users and permissions)
  # with an obviously fake password for every user, quoted as in
  # docker-compose.yml ("5e62..." would otherwise parse as a number).
  nats-auth:
    image: nats:2.14.7-alpine3.22@sha256:4063edae0717ba5f7501bfde75f97fd9b57f5b93597b92c70b6a6fbbf6a74e06
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      VENDOR_EVENTBUS_PASSWORD: '"5e62-test-eventbus-password-not-a-secret"'
      CATALOG_EVENTBUS_PASSWORD: '"5e62-test-eventbus-password-not-a-secret"'
      INVENTORY_EVENTBUS_PASSWORD: '"5e62-test-eventbus-password-not-a-secret"'
      ORDER_EVENTBUS_PASSWORD: '"5e62-test-eventbus-password-not-a-secret"'
      PAYMENT_EVENTBUS_PASSWORD: '"5e62-test-eventbus-password-not-a-secret"'
      SHIPMENT_EVENTBUS_PASSWORD: '"5e62-test-eventbus-password-not-a-secret"'
      NOTIFICATION_EVENTBUS_PASSWORD: '"5e62-test-eventbus-password-not-a-secret"'
    volumes: ["./nats/nats.conf:/etc/nats/nats.conf:ro"]
    tmpfs: ["/data"]
    ports: ["127.0.0.1:54223:4222"]
