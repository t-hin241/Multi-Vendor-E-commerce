# Production edge: Caddy is the only service published on a public
# interface (80/443, TLS). Use it on top of the main file, best through
# COMPOSE_FILE=docker-compose.yml:deploy/compose.edge.yml in the server's
# .env so no command runs without it:
#
#   docker compose -f docker-compose.yml -f deploy/compose.edge.yml up -d
#
# Paths below are relative to the project directory (the main file's).
# Docker publishes ports past the host firewall (ufw), so what is closed is
# decided here, not by the firewall: check with "bash deploy/check-exposure.sh".
# See deploy/edge-runbook.md.

services:
  caddy:
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    restart: unless-stopped
    # Only the edge network: the proxy reaches the gateway, the frontend and
    # the media buckets, never a database, Redis, NATS or a service directly.
    networks:
      edge:
        ipv4_address: ${EDGE_PROXY_IP:-192.168.250.10}
    # Same budgets as the main file: rotating logs, memory limit.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 128m
    environment:
      GOMEMLIMIT: 108MiB
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - frontend
      - minio
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    networks: [shopee, edge]
    # Reached through Caddy only.
    ports: !reset []
    environment:
      # Client IPs are taken from X-Forwarded-For only when Caddy's own
      # address sends it (not the rest of the subnet, which includes the
      # host's bridge address).
      TRUSTED_PROXY_CIDRS: ${EDGE_PROXY_IP:-192.168.250.10}

  frontend:
    networks: [shopee, edge]
    ports: !reset []

  minio:
    networks: [shopee, edge]

# EDGE_PROXY_IP must lie inside EDGE_SUBNET; change both together if the
# default range is taken on the host.
networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-192.168.250.0/28}

volumes:
  caddy-data:
  caddy-config:
