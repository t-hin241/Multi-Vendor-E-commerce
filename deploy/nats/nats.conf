            "$JS.ACK.*.*.SHOPEE_EVENTS.order-payment-outcomes.>"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-refund-outcomes"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-refund-outcomes.>"
            "$JS.API.CONSUMER.INFO.SHOPEE_EVENTS.order-refund-outcomes"
            "$JS.API.CONSUMER.MSG.NEXT.SHOPEE_EVENTS.order-refund-outcomes"
            "$JS.ACK.SHOPEE_EVENTS.order-refund-outcomes.>"
            "$JS.ACK.*.*.SHOPEE_EVENTS.order-refund-outcomes.>"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-policy-versions"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-policy-versions.>"
            "$JS.API.CONSUMER.INFO.SHOPEE_EVENTS.order-policy-versions"
            "$JS.API.CONSUMER.MSG.NEXT.SHOPEE_EVENTS.order-policy-versions"
            "$JS.ACK.SHOPEE_EVENTS.order-policy-versions.>"
