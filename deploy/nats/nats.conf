            "$JS.ACK.*.*.SHOPEE_EVENTS.order-product-status.>"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-reservation-expiry"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-reservation-expiry.>"
            "$JS.API.CONSUMER.INFO.SHOPEE_EVENTS.order-reservation-expiry"
            "$JS.API.CONSUMER.MSG.NEXT.SHOPEE_EVENTS.order-reservation-expiry"
            "$JS.ACK.SHOPEE_EVENTS.order-reservation-expiry.>"
            "$JS.ACK.*.*.SHOPEE_EVENTS.order-reservation-expiry.>"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-shipment-facts"
            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-shipment-facts.>"
            "$JS.API.CONSUMER.INFO.SHOPEE_EVENTS.order-shipment-facts"
            "$JS.API.CONSUMER.MSG.NEXT.SHOPEE_EVENTS.order-shipment-facts"
