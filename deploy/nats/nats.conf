# NATS for the event bus (PLT-01/03). Every connection logs in as its
# service; there is no anonymous access. Each service may:
#   - publish only its own event types: shopee.events.<service>.>
#     (an event type is "<producing service>.<fact>", pkg/events), so a
#     service cannot forge another's facts, e.g. a payment outcome;
#   - read only through its own durable consumers (named "<service>-...");
#   - receive replies only on its own inbox prefix (_INBOX_<service>), so it
#     cannot read messages fetched by another service;
#   - manage the stream SHOPEE_EVENTS (each producer makes sure it exists
#     before publishing), and nothing else of JetStream.
# Passwords come from the environment (docker-compose.yml): the service's
# own internal key, or the shared key in local development.
#
# Adding a consumer or a service: add the durable (or the user) below; the
# test in backend/pkg/eventbus/natsconf_test.go fails until it is here.

port: 4222
http_port: 8222
max_payload: 1MB

# Disk budget: the stream is capped at 1 GB (pkg/eventbus; an alert fires
# at 80%, before a consumer that is down could lose unread events); the
# server refuses to store more than 2 GB in total.
jetstream {
  store_dir: /data
  max_file_store: 2GB
  max_memory_store: 64MB
}

authorization {
  users = [
    {
      user: vendor
      password: $VENDOR_EVENTBUS_PASSWORD
      permissions: {
        publish: {
          allow: [
            "$JS.API.STREAM.INFO.SHOPEE_EVENTS"
            "$JS.API.STREAM.CREATE.SHOPEE_EVENTS"
            "$JS.API.STREAM.UPDATE.SHOPEE_EVENTS"
            "shopee.events.vendor.>"
          ]
        }
        subscribe: { allow: ["_INBOX_vendor.>"] }
      }
    }
    {
      user: catalog
      password: $CATALOG_EVENTBUS_PASSWORD
      permissions: {
