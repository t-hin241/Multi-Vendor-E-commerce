            "$JS.API.CONSUMER.CREATE.SHOPEE_EVENTS.order-product-status.>"
            "$JS.API.CONSUMER.INFO.SHOPEE_EVENTS.order-product-status"
            "$JS.API.CONSUMER.MSG.NEXT.SHOPEE_EVENTS.order-product-status"
