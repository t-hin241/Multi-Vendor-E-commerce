            "$JS.API.CONSUMER.MSG.NEXT.SHOPEE_EVENTS.catalog-vendor-status"
            "$JS.ACK.SHOPEE_EVENTS.catalog-vendor-status.>"
            "$JS.ACK.*.*.SHOPEE_EVENTS.catalog-vendor-status.>"
