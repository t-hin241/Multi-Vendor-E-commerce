            "$JS.API.CONSUMER.INFO.SHOPEE_EVENTS.shipment-fulfillment-cancelled"
            "$JS.API.CONSUMER.MSG.NEXT.SHOPEE_EVENTS.shipment-fulfillment-cancelled"
            "$JS.ACK.SHOPEE_EVENTS.shipment-fulfillment-cancelled.>"
            "$JS.ACK.*.*.SHOPEE_EVENTS.shipment-fulfillment-cancelled.>"
          ]
        }
        subscribe: { allow: ["_INBOX_shipment.>"] }
      }
    }
    {
      user: notification
      password: $NOTIFICATION_EVENTBUS_PASSWORD
      permissions: {
        publish: {
