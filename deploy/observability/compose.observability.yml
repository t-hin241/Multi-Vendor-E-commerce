# Metrics, traces and dashboards, self-hosted next to the stack. Add it on
# top of the main file (and the edge file in production), best through
# COMPOSE_FILE in .env so no command runs without it:
#
#   COMPOSE_FILE=docker-compose.yml:deploy/compose.edge.yml:deploy/observability/compose.observability.yml
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
#
# Nothing here is published beyond 127.0.0.1 and Caddy routes nothing to
# it: open Grafana through an SSH tunnel (ssh -L 3001:127.0.0.1:3001 vps).
# Budget: about 1.6 GB of the 8 GB (deploy/observability-runbook.md).
# Paths are relative to the project directory (the main file's).

x-observability: &observability
  restart: unless-stopped
  networks: [shopee]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  prometheus:
    <<: *observability
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Whichever comes first: 15 days or 4 GB of disk.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=4GB
      # Tempo's span metrics (service graph) and k6 results arrive by remote write.
      - --web.enable-remote-write-receiver
    environment:
      GOMEMLIMIT: 430MiB
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  tempo:
    <<: *observability
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    mem_limit: 512m
    command: ["-target=all", "-config.file=/etc/tempo.yaml"]
    environment:
      GOMEMLIMIT: 430MiB
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  grafana:
    <<: *observability
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    mem_limit: 256m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, tempo]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

  # Per-container CPU, memory against its limit, restarts, network. Reads
  # the Docker socket (read-only mount, but the API itself is not limited):
  # never publish it.
  cadvisor:
    <<: *observability
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    mem_limit: 160m
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg

  # Host disk, memory, CPU and network.
  node-exporter:
    <<: *observability
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    mem_limit: 48m
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro

  # Connections, transactions, cache hits, locks and the statements using
  # the most time (pg_stat_statements). Role: deploy/observability/monitor-role.sh.
  postgres-exporter:
    <<: *observability
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    mem_limit: 64m
    command:
      - --collector.stat_statements
      - --collector.stat_statements.include_query
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: shopee_monitor
      DATA_SOURCE_PASS: ${MONITOR_DB_PASSWORD:?set MONITOR_DB_PASSWORD in .env}
    depends_on: [postgres]

  redis-exporter:
    <<: *observability
    image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820
    mem_limit: 48m
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]

  # JetStream stream size and consumers' pending/redelivered counts.
  nats-exporter:
    <<: *observability
    image: natsio/prometheus-nats-exporter:0.20.2@sha256:c623b608e148e31e1c1c878673a197f1828e58ce90de4f01d22f1baa84c8fee9
    mem_limit: 48m
    command: ["-varz", "-connz", "-healthz", "-jsz=all", "http://nats:8222"]
    depends_on: [nats]

volumes:
  prometheus-data:
  tempo-data:
  grafana-data:
