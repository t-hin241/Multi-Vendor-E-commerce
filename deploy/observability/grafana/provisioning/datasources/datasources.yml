# Provisioned at startup; edits in the UI are not kept.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Service graph from Tempo's span metrics (remote-written to Prometheus).
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
