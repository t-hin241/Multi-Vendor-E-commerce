# Scrapes every service's internal /metrics (pkg/telemetry, port 9464) and
# the exporters. Rules: alerts.yml. Remote write receives Tempo's span
# metrics and, during load tests, k6 results.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - gateway:9464
          - identity:9464
          - vendor:9464
          - catalog:9464
          - inventory:9464
          - cart:9464
          - order:9464
          - payment:9464
          - shipment:9464
          - admin:9464
          - notification:9464
          - review:9464
    relabel_configs:
      # service="order" instead of the address.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # Containers of this project only, named by their Compose service.
      - source_labels: [container_label_com_docker_compose_service]
        regex: ".+"
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  # redis: rate-limit counters (evicts when full); queue: notification jobs (never evicts).
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
        labels: {redis: cache}
      - targets: [redis-queue-exporter:9121]
        labels: {redis: queue}

  - job_name: nats
    static_configs:
      - targets: [nats-exporter:7777]

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
