name: shopee

# Build images with "bash deploy/build-images.sh" (one image at a time, base
# images pulled first, retried on failure). A plain "docker compose build"
# or "up --build" builds every image in parallel and can time out with
# "failed to solve: context deadline exceeded" on a slow network or host.

# Published ports listen on loopback only (INTERNAL_BIND_ADDRESS,
# PUBLIC_BIND_ADDRESS). On a VPS the public entry point is Caddy with TLS:
# add -f deploy/compose.edge.yml (see deploy/edge-runbook.md).

# Resource budgets for a 4 vCPU / 8 GB VPS (deploy/observability-runbook.md):
# every container has a memory limit, Go processes a GOMEMLIMIT at ~85% of
# it (the GC works harder before the kernel kills), and container logs
# rotate at 3 x 10 MB so they cannot fill the disk. No CPU limits: throttling
# would hide where the time goes.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *logging
  mem_limit: 128m
  networks:
    - shopee
  # Each service waits for what it uses: Redis only for identity, payment,
  # review and notification; NATS only for the services on the event bus.
  depends_on:
    postgres:
      condition: service_healthy

x-service-env-defaults: &service-env-defaults
  ENV: ${ENV:-development}
  LOG_LEVEL: info
  NATS_URL: nats://nats:4222
  SHUTDOWN_TIMEOUT: "10"
  HTTP_READ_TIMEOUT: "5"
  HTTP_IDLE_TIMEOUT: "60"
  # Access tokens are Ed25519-signed by Identity only (its block below has
  # the private key); every service verifies with these public keys and can
  # issue nothing. deploy/gen-jwt-keys.sh, rotation in deploy/identity-runbook.md.
  JWT_PUBLIC_KEYS: ${JWT_PUBLIC_KEYS:?set JWT_PUBLIC_KEYS in .env (deploy/gen-jwt-keys.sh)}
  # Switch-over from the former shared HS256 secret only: until this time
  # (RFC 3339, at most 24h ahead) tokens signed with JWT_SECRET are still
  # accepted, never issued. Leave both empty afterwards.
  JWT_ACCEPT_LEGACY_HS256_UNTIL: ${JWT_ACCEPT_LEGACY_HS256_UNTIL:-}
  JWT_SECRET: ${JWT_SECRET:-}
  IDENTITY_SERVICE_URL: http://identity:8081
  # PLT-01: each service's own key (per service below) and the registry of
  # key hashes every service checks callers against. Without per-service
  # keys (local development) services fall back to the shared key.
  IDENTITY_SERVICE_KEY: ${IDENTITY_SERVICE_KEY:?set IDENTITY_SERVICE_KEY in .env}
  INTERNAL_SERVICE_KEYS: ${INTERNAL_SERVICE_KEYS:-}
  INTERNAL_AUTH_ACCEPT_SHARED_KEY: ${INTERNAL_AUTH_ACCEPT_SHARED_KEY:-false}
  # PLT-03: producers publish domain events to JetStream; "http" = rollback.
  EVENT_PUBLISHING: ${EVENT_PUBLISHING:-jetstream}
  GOMEMLIMIT: 108MiB
  # Telemetry (pkg/telemetry): /metrics on :9464, reachable inside the
  # Docker network only. Traces are exported only when an OTLP endpoint is
  # set (deploy/observability: http://tempo:4318).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
  PPROF_ENABLED: ${PPROF_ENABLED:-false}

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    networks: [shopee]
    logging: *logging
    # 2 GB of the 8 GB budget. Connections: the services' DB_MAX_CONNS add
    # up to 84 (sized from load-test pool usage: Catalog serves every
    # storefront read and every cart/checkout price lookup), plus migrator,
    # monitor and superuser headroom, under 100. Change them together.
    # pg_stat_statements needs a restart to load; slow statements (> 500 ms)
    # are logged without their parameter values (they can hold personal data).
    mem_limit: 2g
    shm_size: 256m
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_wal_size=1GB
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_parameter_max_length=0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Per-service roles (deploy/postgres-init/db-roles.psql): the services
      # connect as <service>_app (rows of their own database only), the
      # migrations as shopee_migrator; POSTGRES_USER stays the superuser for
      # operations (backups, deploy/db-roles.sh).
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}
      VENDOR_DB_PASSWORD: ${VENDOR_DB_PASSWORD:?set VENDOR_DB_PASSWORD in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?set CART_DB_PASSWORD in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      SHIPMENT_DB_PASSWORD: ${SHIPMENT_DB_PASSWORD:?set SHIPMENT_DB_PASSWORD in .env}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?set REVIEW_DB_PASSWORD in .env}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Two Redis instances by kind of data, so one cannot starve the other:
  #   redis        rate-limit counters (identity, payment, review): lose-able,
  #                no persistence, least-recently-used keys evicted when full;
  #   redis-queue  Notification's Asynq jobs: append-only file, never evicts.
  # Both: one ACL user per service, limited to its own key prefix, and no
  # anonymous access (deploy/redis/acl.sh, passwords from
  # deploy/gen-redis-passwords.sh). See deploy/platform-runbook.md.
  redis:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    networks: [shopee]
    command: ["sh", "/etc/redis/acl.sh", "--appendonly", "no", "--save", "", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    logging: *logging
    mem_limit: 96m
    environment:
      REDIS_ROLE: cache
      REDIS_MONITOR_PASSWORD: ${REDIS_MONITOR_PASSWORD:?set REDIS_MONITOR_PASSWORD in .env}
      IDENTITY_REDIS_PASSWORD: ${IDENTITY_REDIS_PASSWORD:?set IDENTITY_REDIS_PASSWORD in .env}
      PAYMENT_REDIS_PASSWORD: ${PAYMENT_REDIS_PASSWORD:?set PAYMENT_REDIS_PASSWORD in .env}
      REVIEW_REDIS_PASSWORD: ${REVIEW_REDIS_PASSWORD:?set REVIEW_REDIS_PASSWORD in .env}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./deploy/redis/acl.sh:/etc/redis/acl.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user monitor --pass \"$$REDIS_MONITOR_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-queue:
    image: redis:7.4.11-alpine3.21@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    networks: [shopee]
    # Append-only file so a restart keeps the jobs; never evict (PostgreSQL
    # can rebuild lost jobs, but eviction would make that routine). At
    # maxmemory, enqueueing fails instead: an alert fires at 80% of it.
    command: ["sh", "/etc/redis/acl.sh", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    logging: *logging
    mem_limit: 192m
    environment:
      REDIS_ROLE: queue
      REDIS_MONITOR_PASSWORD: ${REDIS_MONITOR_PASSWORD:?set REDIS_MONITOR_PASSWORD in .env}
      NOTIFICATION_REDIS_PASSWORD: ${NOTIFICATION_REDIS_PASSWORD:?set NOTIFICATION_REDIS_PASSWORD in .env}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_QUEUE_PORT:-6380}:6379"
    volumes:
      # The volume that held the single instance's data: queued jobs survive
      # the split.
      - redis-data:/data
      - ./deploy/redis/acl.sh:/etc/redis/acl.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user monitor --pass \"$$REDIS_MONITOR_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.15.0-alpine3.22@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    networks: [shopee]
    # Per-service users and permissions (deploy/nats/nats.conf): a service
    # publishes only its own event types and reads only its own consumers.
    # Each password is the value that service gets as EVENTBUS_PASSWORD,
    # in double quotes: NATS parses a variable's value as configuration, so
    # an unquoted hex key such as "5e62..." would read as a number.
    command: ["-c", "/etc/nats/nats.conf"]
    logging: *logging
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 216MiB
      VENDOR_EVENTBUS_PASSWORD: '"${VENDOR_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}"'
      CATALOG_EVENTBUS_PASSWORD: '"${CATALOG_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}"'
      INVENTORY_EVENTBUS_PASSWORD: '"${INVENTORY_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}"'
      ORDER_EVENTBUS_PASSWORD: '"${ORDER_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}"'
      PAYMENT_EVENTBUS_PASSWORD: '"${PAYMENT_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}"'
      SHIPMENT_EVENTBUS_PASSWORD: '"${SHIPMENT_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}"'
      NOTIFICATION_EVENTBUS_PASSWORD: '"${NOTIFICATION_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}"'
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${NATS_CLIENT_PORT:-4222}:4222"
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
      - ./deploy/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The last community MinIO image, pinned so nothing newer or different is
  # pulled. Upstream is archived and minio/minio is gone from Docker Hub and
  # quay.io: this pulls only on a host that already has it, and it gets no
  # more security fixes. Replacement: docs/module-details/16-object-storage.md.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    networks: [shopee]
    command: server /data --console-address ":9001"
    logging: *logging
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 216MiB
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: ./backend
      dockerfile: services/identity/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: identity
      REDIS_URL: redis://identity:${IDENTITY_REDIS_PASSWORD}@redis:6379/0
      DB_MAX_CONNS: "8"
      INTERNAL_SERVICE_KEY: ${IDENTITY_INTERNAL_KEY:-}
      IDENTITY_RESET_DELIVERY_KEY: ${IDENTITY_RESET_DELIVERY_KEY:?set IDENTITY_RESET_DELIVERY_KEY in .env}
      # The only place the token signing key goes.
      JWT_SIGNING_KEY_ID: ${JWT_SIGNING_KEY_ID:?set JWT_SIGNING_KEY_ID in .env (deploy/gen-jwt-keys.sh)}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env (deploy/gen-jwt-keys.sh)}
      IDENTITY_RATE_LIMIT_KEY: ${IDENTITY_RATE_LIMIT_KEY:?set IDENTITY_RATE_LIMIT_KEY in .env}
      IDENTITY_RESET_ENCRYPTION_KEY: ${IDENTITY_RESET_ENCRYPTION_KEY:?set IDENTITY_RESET_ENCRYPTION_KEY in .env}
      IDENTITY_TRUSTED_PROXY_CIDRS: ${IDENTITY_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      IDENTITY_ALLOWED_ORIGINS: ${IDENTITY_ALLOWED_ORIGINS:-${ALLOWED_ORIGINS:-http://localhost:3000}}
      IDENTITY_PASSWORD_RESET_URL: ${IDENTITY_PASSWORD_RESET_URL:-http://localhost:3000/reset-password}
      NOTIFICATION_SERVICE_URL: http://notification:8090
      PORT: "8081"
      DATABASE_URL: postgres://identity_app:${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in .env}@postgres:5432/identity_db?sslmode=disable
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8081:8081"

  vendor:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      notification:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/vendor/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: vendor
      DB_MAX_CONNS: "6"
      INTERNAL_SERVICE_KEY: ${VENDOR_INTERNAL_KEY:-}
      EVENTBUS_PASSWORD: ${VENDOR_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}
      PORT: "8082"
      CATALOG_SERVICE_URL: http://catalog:8083
      ORDER_SERVICE_URL: http://order:8086
      PAYMENT_SERVICE_URL: http://payment:8087
      VENDOR_PAYOUT_ENCRYPTION_KEY: ${VENDOR_PAYOUT_ENCRYPTION_KEY:?set VENDOR_PAYOUT_ENCRYPTION_KEY in .env}
      VENDOR_PAYOUT_SERVICE_KEY: ${VENDOR_PAYOUT_SERVICE_KEY:?set VENDOR_PAYOUT_SERVICE_KEY in .env}
      DATABASE_URL: postgres://vendor_app:${VENDOR_DB_PASSWORD:?set VENDOR_DB_PASSWORD in .env}@postgres:5432/vendor_db?sslmode=disable
      NOTIFICATION_SERVICE_URL: http://notification:8090
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_USE_SSL: "false"
      OBJECT_STORAGE_BUCKET: vendor-branding
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-http://localhost:9000}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8082:8082"

  catalog:
    <<: *service-defaults
    # Load test peak 107 MB (it serves every storefront read and price
    # lookup); the other services peak under 80 MB.
    mem_limit: 160m
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio:
        condition: service_healthy
      vendor:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/catalog/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: catalog
      DB_MAX_CONNS: "24"
      GOMEMLIMIT: 136MiB
      INTERNAL_SERVICE_KEY: ${CATALOG_INTERNAL_KEY:-}
      EVENTBUS_PASSWORD: ${CATALOG_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}
      PORT: "8083"
      DATABASE_URL: postgres://catalog_app:${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}@postgres:5432/catalog_db?sslmode=disable
      VENDOR_SERVICE_URL: http://vendor:8082
      ORDER_SERVICE_URL: http://order:8086
      INVENTORY_SERVICE_URL: http://inventory:8084
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_USE_SSL: "false"
      OBJECT_STORAGE_BUCKET: product-images
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-http://localhost:9000}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8083:8083"

  inventory:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      vendor:
        condition: service_started
      catalog:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/inventory/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: inventory
      DB_MAX_CONNS: "8"
      INTERNAL_SERVICE_KEY: ${INVENTORY_INTERNAL_KEY:-}
      EVENTBUS_PASSWORD: ${INVENTORY_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}
      PORT: "8084"
      DATABASE_URL: postgres://inventory_app:${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in .env}@postgres:5432/inventory_db?sslmode=disable
      VENDOR_SERVICE_URL: http://vendor:8082
      CATALOG_SERVICE_URL: http://catalog:8083
      ORDER_SERVICE_URL: http://order:8086
      INVENTORY_EXPIRY_ENABLED: ${INVENTORY_EXPIRY_ENABLED:-false}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8084:8084"

  cart:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      catalog:
        condition: service_started
      inventory:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/cart/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: cart
      DB_MAX_CONNS: "8"
      INTERNAL_SERVICE_KEY: ${CART_INTERNAL_KEY:-}
      PORT: "8085"
      DATABASE_URL: postgres://cart_app:${CART_DB_PASSWORD:?set CART_DB_PASSWORD in .env}@postgres:5432/cart_db?sslmode=disable
      CATALOG_SERVICE_URL: http://catalog:8083
      INVENTORY_SERVICE_URL: http://inventory:8084
      CART_RETENTION_ENABLED: ${CART_RETENTION_ENABLED:-true}
      CART_RETENTION_DAYS: ${CART_RETENTION_DAYS:-180}
      CART_OPERATION_RETENTION_DAYS: ${CART_OPERATION_RETENTION_DAYS:-90}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8085:8085"

  order:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      cart:
        condition: service_started
      catalog:
        condition: service_started
      vendor:
        condition: service_started
      inventory:
        condition: service_started
      notification:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/order/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: order
      DB_MAX_CONNS: "10"
      INTERNAL_SERVICE_KEY: ${ORDER_INTERNAL_KEY:-}
      EVENTBUS_PASSWORD: ${ORDER_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}
      PORT: "8086"
      DATABASE_URL: postgres://order_app:${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in .env}@postgres:5432/order_db?sslmode=disable
      CART_SERVICE_URL: http://cart:8085
      CATALOG_SERVICE_URL: http://catalog:8083
      VENDOR_SERVICE_URL: http://vendor:8082
      INVENTORY_SERVICE_URL: http://inventory:8084
      SHIPMENT_SERVICE_URL: http://shipment:8088
      NOTIFICATION_SERVICE_URL: http://notification:8090
      # No depends_on: Payment already depends on Order; refund requests are
      # durable effects retried until Payment is up.
      PAYMENT_SERVICE_URL: http://payment:8087
      ORDER_RETURN_WINDOW_DAYS: ${ORDER_RETURN_WINDOW_DAYS:-7}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8086:8086"

  payment:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      order:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/payment/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: payment
      REDIS_URL: redis://payment:${PAYMENT_REDIS_PASSWORD}@redis:6379/0
      DB_MAX_CONNS: "6"
      INTERNAL_SERVICE_KEY: ${PAYMENT_INTERNAL_KEY:-}
      EVENTBUS_PASSWORD: ${PAYMENT_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}
      PORT: "8087"
      DATABASE_URL: postgres://payment_app:${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}@postgres:5432/payment_db?sslmode=disable
      ORDER_SERVICE_URL: http://order:8086
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_MOCK_WEBHOOK_SECRET: ${PAYMENT_MOCK_WEBHOOK_SECRET:?set PAYMENT_MOCK_WEBHOOK_SECRET in .env}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_API_URL: ${PAYOS_API_URL:-https://api-merchant.payos.vn}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:3000/orders/payment-return}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:3000/orders/payment-cancel}
      VENDOR_SERVICE_URL: http://vendor:8082
      PAYMENT_WEBHOOK_RATE_PER_MINUTE: ${PAYMENT_WEBHOOK_RATE_PER_MINUTE:-600}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8087:8087"

  shipment:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      vendor:
        condition: service_started
      order:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/shipment/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: shipment
      DB_MAX_CONNS: "4"
      INTERNAL_SERVICE_KEY: ${SHIPMENT_INTERNAL_KEY:-}
      EVENTBUS_PASSWORD: ${SHIPMENT_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}
      PORT: "8088"
      DATABASE_URL: postgres://shipment_app:${SHIPMENT_DB_PASSWORD:?set SHIPMENT_DB_PASSWORD in .env}@postgres:5432/shipment_db?sslmode=disable
      VENDOR_SERVICE_URL: http://vendor:8082
      ORDER_SERVICE_URL: http://order:8086
      # manual (default): tracking entered by vendors/admins. mock: simulated
      # carrier for local testing; refused when ENV=production.
      SHIPMENT_CARRIER_PROVIDER: ${SHIPMENT_CARRIER_PROVIDER:-manual}
      SHIPMENT_CARRIER_MOCK_WEBHOOK_SECRET: ${SHIPMENT_CARRIER_MOCK_WEBHOOK_SECRET:-}
      SHIPMENT_ADDRESS_RETENTION_DAYS: ${SHIPMENT_ADDRESS_RETENTION_DAYS:-180}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8088:8088"

  admin:
    <<: *service-defaults
    build:
      context: ./backend
      dockerfile: services/admin/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: admin
      DB_MAX_CONNS: "2"
      INTERNAL_SERVICE_KEY: ${ADMIN_INTERNAL_KEY:-}
      PORT: "8089"
      DATABASE_URL: postgres://admin_app:${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD in .env}@postgres:5432/admin_db?sslmode=disable
      # Read-only dashboard and audit search over these services, as the
      # signed-in admin (the admin's token is forwarded; no extra secret).
      VENDOR_SERVICE_URL: http://vendor:8082
      CATALOG_SERVICE_URL: http://catalog:8083
      INVENTORY_SERVICE_URL: http://inventory:8084
      ORDER_SERVICE_URL: http://order:8086
      PAYMENT_SERVICE_URL: http://payment:8087
      SHIPMENT_SERVICE_URL: http://shipment:8088
      NOTIFICATION_SERVICE_URL: http://notification:8090
      REVIEW_SERVICE_URL: ${ADMIN_REVIEW_SERVICE_URL-http://review:8091}
      ADMIN_UPSTREAM_TIMEOUT: ${ADMIN_UPSTREAM_TIMEOUT:-4s}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8089:8089"

  review:
    <<: *service-defaults
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      identity:
        condition: service_started
      order:
        condition: service_started
      vendor:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/review/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: review
      REDIS_URL: redis://review:${REVIEW_REDIS_PASSWORD}@redis:6379/0
      DB_MAX_CONNS: "4"
      INTERNAL_SERVICE_KEY: ${REVIEW_INTERNAL_KEY:-}
      PORT: "8091"
      DATABASE_URL: postgres://review_app:${REVIEW_DB_PASSWORD:?set REVIEW_DB_PASSWORD in .env}@postgres:5432/review_db?sslmode=disable
      ORDER_SERVICE_URL: http://order:8086
      VENDOR_SERVICE_URL: http://vendor:8082
      IDENTITY_SERVICE_URL: http://identity:8081
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_USE_SSL: "false"
      OBJECT_STORAGE_BUCKET: review-images
      OBJECT_STORAGE_PUBLIC_BASE_URL: ${OBJECT_STORAGE_PUBLIC_BASE_URL:-http://localhost:9000}
      # true also lists seeded reviews that are not verified purchases
      # (local/staging demo data); refused when ENV=production.
      REVIEW_SHOW_UNVERIFIED: ${REVIEW_SHOW_UNVERIFIED:-false}
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8091:8091"

  notification:
    <<: *service-defaults
    # Running delivery jobs get SHUTDOWN_TIMEOUT to finish after the HTTP server.
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity:
        condition: service_started
    build:
      context: ./backend
      dockerfile: services/notification/Dockerfile
    environment:
      <<: *service-env-defaults
      INTERNAL_SERVICE_NAME: notification
      REDIS_URL: redis://notification:${NOTIFICATION_REDIS_PASSWORD}@redis-queue:6379/0
      DB_MAX_CONNS: "4"
      INTERNAL_SERVICE_KEY: ${NOTIFICATION_INTERNAL_KEY:-}
      EVENTBUS_PASSWORD: ${NOTIFICATION_INTERNAL_KEY:-${IDENTITY_SERVICE_KEY}}
      IDENTITY_RESET_DELIVERY_KEY: ${IDENTITY_RESET_DELIVERY_KEY:?set IDENTITY_RESET_DELIVERY_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ALLOW_PLAINTEXT: ${SMTP_ALLOW_PLAINTEXT:-false}
      # smtp (needs SMTP_HOST/SMTP_FROM) or mock (local only, refused in
      # production). Empty: smtp when SMTP_HOST is set, otherwise mock.
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-}
      NOTIFICATION_ATTEMPT_RETENTION_DAYS: ${NOTIFICATION_ATTEMPT_RETENTION_DAYS:-90}
      # true stops sending; requests are still recorded and sent on resume.
      NOTIFICATION_DELIVERY_PAUSED: ${NOTIFICATION_DELIVERY_PAUSED:-false}
      # Delivery jobs run at once (Asynq workers on REDIS_URL), 1-100.
      NOTIFICATION_WORKER_CONCURRENCY: ${NOTIFICATION_WORKER_CONCURRENCY:-10}
      PORT: "8090"
      DATABASE_URL: postgres://notification_app:${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}@postgres:5432/notification_db?sslmode=disable
      IDENTITY_SERVICE_URL: http://identity:8081
    ports:
      - "${INTERNAL_BIND_ADDRESS:-127.0.0.1}:8090:8090"

  gateway:
    restart: unless-stopped
    networks: [shopee]
    logging: *logging
    mem_limit: 128m
    build:
      context: ./backend
      dockerfile: gateway/Dockerfile
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: info
      PORT: "8080"
      GOMEMLIMIT: 108MiB
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      PPROF_ENABLED: ${PPROF_ENABLED:-false}
      TRUSTED_PROXY_CIDRS: ${GATEWAY_TRUSTED_PROXY_CIDRS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      IDENTITY_SERVICE_URL: http://identity:8081
      VENDOR_SERVICE_URL: http://vendor:8082
      CATALOG_SERVICE_URL: http://catalog:8083
      INVENTORY_SERVICE_URL: http://inventory:8084
      CART_SERVICE_URL: http://cart:8085
      ORDER_SERVICE_URL: http://order:8086
      PAYMENT_SERVICE_URL: http://payment:8087
      SHIPMENT_SERVICE_URL: http://shipment:8088
      ADMIN_SERVICE_URL: http://admin:8089
      NOTIFICATION_SERVICE_URL: http://notification:8090
      REVIEW_SERVICE_URL: http://review:8091
    depends_on:
      - identity
      - vendor
      - catalog
      - inventory
      - cart
      - order
      - payment
      - shipment
      - admin
      - notification
      - review
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"

  frontend:
    restart: unless-stopped
    networks: [shopee]
    logging: *logging
    mem_limit: 512m
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      # V8's heap stays inside the 512 MB container limit.
      NODE_OPTIONS: --max-old-space-size=384
    depends_on:
      - gateway
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"

networks:
  shopee:

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
